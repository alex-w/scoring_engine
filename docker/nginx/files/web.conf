# Keepalive connection pool to uWSGI
upstream uwsgi_backend {
    server web:5000;
    keepalive 16;
}

# Redirect to https
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_tokens off;

  ssl_certificate     /etc/nginx/scoringengine.crt;
  ssl_certificate_key /etc/nginx/scoringengine.key;

  client_max_body_size 25m;
  client_body_buffer_size 1m;

  # Gzip compression for API responses and static assets
  gzip on;
  gzip_types application/json text/css application/javascript text/plain;
  gzip_min_length 256;
  gzip_vary on;

  # SSE event stream — proxy to gevent server (separate from uWSGI)
  location = /api/events {
      proxy_pass http://web:8001;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 86400s;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
  }

  # Liveness probe — deliberately public.
  #
  # /health is a static 200 with no dependency detail. It tells a caller only
  # "this process answers requests", which they already learn from any other
  # page on the site, so exposing it leaks nothing. It stays public so an
  # external load balancer can pull a wedged instance out of rotation.
  #
  # The catch-all "location /" below would already route it; this block exists
  # to give balancers (which poll every few seconds) short timeouts so a wedged
  # backend fails fast, and to keep the polling out of the access log.
  # Cache-Control comes from the app itself, so nothing is added here.
  location = /health {
      include            uwsgi_params;
      uwsgi_pass         uwsgi_backend;

      access_log off;

      uwsgi_read_timeout 5s;
      uwsgi_send_timeout 5s;
      uwsgi_connect_timeout 2s;
  }

  # Readiness probe — deliberately NOT public.
  #
  # /health/ready reports whether the scoring database and Redis are reachable.
  # During a competition that is free reconnaissance: it tells a red team
  # exactly when the scoring infrastructure is degraded, i.e. when their
  # activity is least likely to be recorded. Nothing outside the container
  # needs it — the docker-compose healthcheck curls uWSGI's loopback-only HTTP
  # socket inside the web container and never traverses nginx.
  #
  # An exact-match location wins over the catch-all "location /" below, so the
  # request is answered here and never reaches the application. 404 rather than
  # 403 because a 403 confirms the endpoint exists. (nginx's 404 body differs
  # from the application's own 404 body, which at most reveals that the path is
  # special-cased — never the state of any dependency.)
  #
  # If an external orchestrator must poll readiness, do not simply delete this
  # block — that would fall through to the catch-all and make readiness public
  # again. Replace the `return 404` with an explicit allow list, e.g.:
  #
  #     allow 10.1.2.0/24;   # the orchestrator, not "all of RFC1918"
  #     deny all;
  #     include    uwsgi_params;
  #     uwsgi_pass uwsgi_backend;
  #
  # Note that when Docker's userland proxy is in play every request appears to
  # originate from the bridge gateway, so a broad RFC1918 allow list can
  # silently allow the whole internet. Allow-list specific addresses only.
  location = /health/ready {
      access_log off;
      return 404;
  }

  # Serve static files directly from /app/static
  location /static/ {
      root /usr/share/nginx/html/;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, no-transform";
      gzip_static on;
  }

  # Main application proxy to Flask
  location / {
    include            uwsgi_params;
    uwsgi_pass         uwsgi_backend;

    uwsgi_buffer_size 64k;
    uwsgi_buffers 8 64k;
    uwsgi_busy_buffers_size 128k;
    uwsgi_max_temp_file_size 0;

    uwsgi_read_timeout 60s;
    uwsgi_send_timeout 60s;
    uwsgi_connect_timeout 10s;

    proxy_redirect     off;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Host $server_name;
  }
}
